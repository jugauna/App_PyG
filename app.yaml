# App PyG — DigitalOcean App Platform (Docker monolito)
# Servicio único: FastAPI en 8000 (/api + SPA estática).

name: app-pyg
region: nyc

services:
  - name: web-app
    source_dir: .
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: WELLS_PARQUET
        scope: RUN_TIME
        value: data/parquet/wells_master.parquet
      - key: CORS_ALLOW_ORIGINS
        scope: RUN_TIME
        value: https://upstream.remasa.com

domains:
  - domain: upstream.remasa.com
    type: PRIMARY
