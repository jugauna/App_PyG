# App PyG — DigitalOcean App Platform (Docker)
# Conectá el repo en la UI de DO o añadí un bloque `git` con repo y branch.
#
# Reglas de ruta: /api → backend (FastAPI), / → frontend (Nginx SPA).
# Dominio: upstream.remasa.com
#
# VITE_API_BASE: URL pública del backend (sin sufijo /api); el cliente Axios usa rutas /api/....

name: app-pyg
region: nyc

services:
  - name: backend
    source_dir: .
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    envs:
      - key: WELLS_PARQUET
        scope: RUN_TIME
        value: /app/data/parquet/wells_master.parquet
      - key: CORS_ALLOW_ORIGINS
        scope: RUN_TIME
        value: https://upstream.remasa.com

  - name: frontend
    source_dir: .
    dockerfile_path: frontend/Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: VITE_API_BASE
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

domains:
  - domain: upstream.remasa.com
    type: PRIMARY
